name: Android Play Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Google Play version code
        required: true
        default: "1"
        type: string
      version_name:
        description: User-facing semantic version
        required: true
        default: "1.0.0"
        type: string
      publish_internal:
        description: Upload the signed AAB to Google Play internal testing after build
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: workout-coach-google-play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release inputs
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "version_code must be a positive integer."
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version_name must use semantic versioning, for example 1.0.0."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm audit --omit=dev --audit-level=high
          npm test
          npm run lint
          npm run check:android-release

      - name: Validate production and signing secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SYNC_API_URL: ${{ secrets.VITE_SYNC_API_URL }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_SYNC_API_URL ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Restore upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/workout-coach-upload.jks"
          chmod 600 "$RUNNER_TEMP/workout-coach-upload.jks"

      - name: Verify upload keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/workout-coach-upload.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build production web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SYNC_API_URL: ${{ secrets.VITE_SYNC_API_URL }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build signed Android App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/workout-coach-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: bash -lc 'cd android && ./gradlew bundleRelease --no-daemon'

      - name: Verify signed bundle
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Export upload certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -exportcert -rfc \
            -keystore "$RUNNER_TEMP/workout-coach-upload.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/workout-coach-upload-certificate.pem"
          sha256sum android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workout-coach-play-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/workout-coach-upload-certificate.pem
          if-no-files-found: error
          retention-days: 30

      - name: Validate Google Play publishing credential
        if: ${{ inputs.publish_internal }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "Missing required GitHub secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

      - name: Upload to Google Play internal testing
        if: ${{ inputs.publish_internal }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
          ANDROID_PACKAGE_NAME: com.yvan.workoutcoach
          GOOGLE_PLAY_TRACK: qa
          GOOGLE_PLAY_RELEASE_STATUS: completed
          GOOGLE_PLAY_RELEASE_NAME: Workout Coach ${{ inputs.version_name }}
        run: npm run play:upload-internal
