name: Dependency remediation

on:
  push:
    branches:
      - fix/reliable-local-persistence-20261008

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/reliable-local-persistence-20261008

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update production dependencies
        run: |
          npm install --save-exact @capacitor/android@8.5.3 @capacitor/core@8.5.3 @capacitor/haptics@8.0.2 @supabase/supabase-js@2.117.3
          npm install --save-dev --save-exact @capacitor/cli@8.5.3

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Update vulnerable production dependencies"
          git push origin HEAD:fix/reliable-local-persistence-20261008
