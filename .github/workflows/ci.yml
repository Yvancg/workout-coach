name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Wrangler Worker dry run
        run: npx wrangler deploy --dry-run --outdir worker-dist

      - name: Upload Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: workout-coach-worker-bundle
          path: worker-dist/
          retention-days: 1

      - name: Capacitor Android sync
        run: npx cap sync android
