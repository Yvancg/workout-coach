name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Android Play readiness
        run: npm run check:android-release

      - name: Web performance budget
        run: npm run check:web-budget

      - name: Browser E2E
        run: npm run test:e2e

      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply workout_coach --local

      - name: Wrangler Worker dry run
        run: npx wrangler deploy --dry-run --outdir worker-dist

      - name: Upload Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: workout-coach-worker-bundle
          path: worker-dist/
          retention-days: 1

      - name: Emit Worker bundle handoff
        run: |
          echo "__WORKOUT_WORKER_BUNDLE_BEGIN__"
          base64 -w 0 worker-dist/index.js
          echo
          echo "__WORKOUT_WORKER_BUNDLE_END__"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Capacitor Android sync
        run: npx cap sync android

      - name: Generate disposable CI signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/workout-coach-ci.jks" \
            -storepass "ci-only-password" \
            -keypass "ci-only-password" \
            -alias "ci-upload" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Workout Coach CI,O=CI,C=US"

      - name: Android signed release bundle validation
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/workout-coach-ci.jks
          ANDROID_KEYSTORE_PASSWORD: ci-only-password
          ANDROID_KEY_ALIAS: ci-upload
          ANDROID_KEY_PASSWORD: ci-only-password
          ANDROID_VERSION_CODE: "1"
          ANDROID_VERSION_NAME: "1.0.0"
        run: bash -lc 'cd android && ./gradlew bundleRelease --no-daemon'

      - name: Verify Android bundle signature
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Android CI bundle
        uses: actions/upload-artifact@v4
        with:
          name: workout-coach-android-ci-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
