name: Android Device Test Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      connected_build:
        description: Include Supabase authentication and Worker sync
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: workout-coach-android-device-test
  cancel-in-progress: true

env:
  PUBLIC_SUPABASE_URL: https://acdlnecvjwctpgqjgnsr.supabase.co
  PUBLIC_SUPABASE_KEY: sb_publishable_TYZmvKmev2QHNbi0IBQNkA_gNLZU0-o
  PUBLIC_SYNC_API_URL: https://workout-coach-api.yvan11.workers.dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm audit --omit=dev --audit-level=high
          npm test
          npm run lint
          npm run check:android

      - name: Build web app
        env:
          MANUAL_CONNECTED_BUILD: ${{ inputs.connected_build }}
        run: |
          if [[ "${{ github.event_name }}" == "push" || "$MANUAL_CONNECTED_BUILD" == "true" ]]; then
            export VITE_SUPABASE_URL="$PUBLIC_SUPABASE_URL"
            export VITE_SUPABASE_ANON_KEY="$PUBLIC_SUPABASE_KEY"
            export VITE_SYNC_API_URL="$PUBLIC_SYNC_API_URL"
            echo "Building connected phone-test APK."
          else
            unset VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_SYNC_API_URL
            echo "Building local-only phone-test APK."
          fi
          npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build installable debug APK
        run: bash -lc 'cd android && ./gradlew assembleDebug --no-daemon'

      - name: Upload phone-test APK
        uses: actions/upload-artifact@v4
        with:
          name: workout-coach-phone-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
