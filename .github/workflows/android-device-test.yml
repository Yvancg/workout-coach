name: Android Device Test Build

on:
  workflow_dispatch:
    inputs:
      connected_build:
        description: Include configured Supabase/Worker connectivity
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: workout-coach-android-device-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm audit --omit=dev --audit-level=high
          npm test
          npm run lint
          npm run check:android

      - name: Validate connected-build configuration
        if: ${{ inputs.connected_build }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SYNC_API_URL: ${{ secrets.VITE_SYNC_API_URL }}
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_SYNC_API_URL; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub secret for connected build: $name"
              exit 1
            fi
          done

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ inputs.connected_build && secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ inputs.connected_build && secrets.VITE_SUPABASE_ANON_KEY || '' }}
          VITE_SYNC_API_URL: ${{ inputs.connected_build && secrets.VITE_SYNC_API_URL || '' }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build installable debug APK
        run: bash -lc 'cd android && ./gradlew assembleDebug --no-daemon'

      - name: Upload phone-test APK
        uses: actions/upload-artifact@v4
        with:
          name: workout-coach-phone-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
